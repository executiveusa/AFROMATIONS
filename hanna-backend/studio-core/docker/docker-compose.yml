version: '3.9'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://afromations:secret@postgres:5432/afromations
      DATABASE_URL_SYNC: postgresql://afromations:secret@postgres:5432/afromations
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: afromations-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ..:/app
    restart: unless-stopped

  worker-generation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: celery -A workers.celery_app worker --loglevel=info -Q generation -c 4 -n generation@%h
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://afromations:secret@postgres:5432/afromations
      DATABASE_URL_SYNC: postgresql://afromations:secret@postgres:5432/afromations
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: afromations-assets
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ..:/app
    restart: unless-stopped

  worker-composition:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: celery -A workers.celery_app worker --loglevel=info -Q composition -c 2 -n composition@%h
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://afromations:secret@postgres:5432/afromations
      DATABASE_URL_SYNC: postgresql://afromations:secret@postgres:5432/afromations
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: afromations-assets
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ..:/app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afromations
      POSTGRES_USER: afromations
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afromations"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
