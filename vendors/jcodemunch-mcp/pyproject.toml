[project]
name = "jcodemunch-mcp"
version = "1.70.0"
description = "Token-efficient MCP server for source code exploration via tree-sitter AST parsing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "J. Gravelle", email = "j@gravelle.us" },
]
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "httpx>=0.28.1",
    "tree-sitter-language-pack>=1.22.1,<2.0.0",
    "pathspec>=1.1.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/jgravelle/jcodemunch-mcp"
Repository = "https://github.com/jgravelle/jcodemunch-mcp"
"Bug Tracker" = "https://github.com/jgravelle/jcodemunch-mcp/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=2.3.0"]
gemini = ["google-generativeai>=0.8.6"]
openai = ["openai>=3.41.0"]
minimax = ["openai>=3.41.0"]
zhipu = ["openai>=3.41.0"]
dbt = ["pyyaml>=6.0.3"]
http = ["uvicorn>=0.54.0", "starlette>=1.7.0", "anyio>=4.15.1"]
watch = ["watchfiles>=1.3.0"]
semantic = ["sentence-transformers>=6.2.0"]
local-embed = ["onnxruntime>=1.24.3"]
groq = ["openai>=3.41.0"]
groq-voice = ["openai>=3.41.0", "sounddevice>=0.5.6", "numpy>=2.2.6"]
groq-explain = ["openai>=3.41.0", "Pillow>=12.3.0"]
bench = ["openai>=3.41.0", "anthropic>=2.3.0", "pyyaml>=6.0.3", "rich>=15.0.0", "jinja2>=3.1.6"]
all = ["anthropic>=2.3.0", "google-generativeai>=0.8.6", "openai>=3.41.0", "pyyaml>=6.0.3", "uvicorn>=0.54.0", "starlette>=1.7.0", "anyio>=4.15.1", "watchfiles>=1.3.0", "sentence-transformers>=6.2.0", "onnxruntime>=1.24.3", "sounddevice>=0.5.6", "numpy>=2.2.6", "Pillow>=12.3.0", "rich>=15.0.0", "jinja2>=3.1.6"]


[project.scripts]
jcodemunch-mcp = "jcodemunch_mcp.server:main"
gcm = "jcodemunch_mcp.groq.cli:main"
munch-bench = "munch_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jcodemunch_mcp", "munch-bench/munch_bench"]

[tool.hatch.build.targets.sdist]
exclude = [".claude/", "index.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.5",
]
